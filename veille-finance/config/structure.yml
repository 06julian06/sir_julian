# ─────────────────────────────────────────────────────────────────────────────
# STRUCTURE ÉDITORIALE de chaque édition (site + newsletter).
# Logique "J'ai tout perdu en bourse" : on part de ce qui fait perdre de l'argent
# pour construire ce qui protège et fait progresser. Réordonne, renomme, ajoute
# ou supprime des rubriques librement : l'IA suit ce fichier à la lettre.
# Champs : id (unique, sans espace), titre, consigne (ce que l'IA doit produire),
# max_items (nombre maximum d'éléments).
# ─────────────────────────────────────────────────────────────────────────────

rubriques:
  - id: comprendre
    titre: "Comprendre — le mécanisme du jour"
    consigne: >
      Choisis UN mécanisme de marché lié à l'actualité du jour (ex : pourquoi une
      hausse des taux fait baisser les obligations, comment un appel de marge
      liquide un compte, ce qu'est réellement un ETF synthétique). Explique-le
      pas à pas, avec un exemple chiffré simple. Niveau : quelqu'un d'intelligent
      qui veut comprendre, pas un débutant qu'on infantilise.
    max_items: 1

  - id: actualites
    titre: "Actualités — ce qui compte vraiment"
    consigne: >
      Les 3 à 6 informations macro, marchés, banques centrales ou entreprises qui
      ont un impact réel. Pour chacune : le fait (sourcé), puis "pourquoi ça compte"
      en une ou deux phrases. Ignore le bruit et le sensationnel.
    max_items: 6

  - id: investissements
    titre: "Investissements — ce que ça change pour toi"
    consigne: >
      Traduis l'actualité en conséquences concrètes pour MON profil (enveloppes,
      stratégie, règles). Dis clairement : "rien à faire" quand c'est le cas (c'est
      souvent la bonne réponse). Signale toute tentation à laquelle ne pas céder.
      Analyse, pas recommandation personnalisée d'achat/vente de titres précis.
    max_items: 4

  - id: nouveautes
    titre: "Nouveautés — produits, fiscalité, plateformes"
    consigne: >
      Nouveaux ETF, évolutions de frais, changements fiscaux (PEA, assurance-vie,
      flat tax), nouvelles offres de courtiers, réformes de l'épargne. Seulement
      ce qui est nouveau et vérifiable.
    max_items: 4

  - id: regulation
    titre: "Régulation & conformité — l'angle pro"
    consigne: >
      Publications AMF, ACPR, ESMA, EBA, BCE, Commission européenne (MiCA, DORA,
      MiFID, AI Act appliqué à la finance, LCB-FT, finfluenceurs...). Pour chaque
      point : ce qui change, qui est concerné, et ce qu'un professionnel de la
      conformité doit en retenir. C'est ma rubrique carrière : niveau exigeant.
    max_items: 4

  - id: piege
    titre: "Le piège du jour — comment on perd tout"
    consigne: >
      UNE erreur qui fait perdre de l'argent, reliée à l'actualité si possible :
      levier, concentration, FOMO, arnaque/faux conseiller (cite les listes noires
      AMF si pertinent), absence de plan de sortie, biais de confirmation, sur-trading.
      Mécanisme psychologique + exemple chiffré + règle concrète pour s'en protéger.
    max_items: 1

  - id: carriere
    titre: "Coup d'avance — finance réglementée"
    consigne: >
      Un concept, un texte réglementaire ou une question d'entretien type
      (conformité, risques, régulation, stratégie) expliqué de façon à pouvoir le
      ressortir en entretien. Inclure une "réponse modèle" en 3 phrases.
    max_items: 1
